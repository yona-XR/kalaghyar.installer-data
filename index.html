
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>آخرین نسخه</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Tahoma, sans-serif;
      text-align: center;
      background: #BDBDBD;
      margin: 0;
      padding: 8px;
    }

    .update {
      background: white;
      padding: 25px;
      border-radius: 15px;
      width: 100%;
      margin: 0 auto;
      box-shadow: 0 4px 12px #0001;
    }

    h3 {
      color: #222;
    }

    a {
      display: inline-block;
      margin-top: 10px;
      padding: 12px 22px;
      background: #1687ff;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }

    a:hover {
      background: #0069d9;
    }
  </style>
</head>

<body>

  <div class="update">
    <h3>جدیدترین نسخه: 1.8</h3>
    <a href="https://www.google.com">دانلود این نسخه</a>
  </div>

</body>
</html>
